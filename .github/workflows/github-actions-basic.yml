name: Build and test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**'
  push:
    branches:
    - '**'
    - '!branch-*.*'

jobs:
  # Build: build spark-testing-base and run the tests for specified modules.
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - spark: "2.4.8"
            java-version: "11"
            distribution: "temurin"
          - spark: "3.0.2"
            java-version: "11"
            distribution: "temurin"
          - spark: "3.1.2"
            java-version: "11"
            distribution: "temurin"
          - spark: "3.2.2"
            java-version: "11"
            distribution: "temurin"
          - spark: "3.3.1"
            java-version: "11"
            distribution: "temurin"
          - spark: "3.4.0"
            java-version: "11"
            distribution: "temurin"
          - spark: "3.4.0"
            java-version: "17"
            distribution: "temurin"
          - spark: "4.0.0"
            java-version: "17"
            distribution: "temurin"
          - spark: "4.1.0"
            java-version: "17"
            distribution: "temurin"
          - spark: "4.1.1"
            java-version: "17"
            distribution: "temurin"
    env:
      SPARK_VERSION: ${{ matrix.spark }}
    steps:
    - name: Checkout spark-testing-base
      uses: actions/checkout@v4.1.1
      # In order to fetch changed files
      with:
        fetch-depth: 0
        repository: holdenk/spark-testing-base
    - uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: ${{ matrix.distribution }}
        cache: sbt
    - name: Add sbt
      uses: sbt/setup-sbt@v1
    - name: Cache maven modules
      id: cache-maven
      uses: actions/cache@v4
      env:
        cache-name: cache-maven
      with:
        # maven cache files are stored in `~/.m2` & `~/.ivy2` on Linux/macOS
        path: |
          ~/.m2
          ~/.ivy2/cache
          ~/.sbt
          ~/.cache/coursier
        key: ${{ runner.os }}-${{ matrix.java-version }}-${{ matrix.spark }}-build-${{ env.cache-name }}-${{ hashFiles('build.sbt') }}
    - name: Run tests
      run: SPARK_TESTING=yes ./build/sbt clean +compile +test -DsparkVersion=$SPARK_VERSION
  # Python: run the sparktestingbase tests against a pip installed pyspark.
  python:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - pyspark: "3.5.6"
            python-version: "3.11"
            java-version: "17"
          - pyspark: "4.1.1"
            python-version: "3.12"
            java-version: "17"
    steps:
    - name: Checkout spark-testing-base
      uses: actions/checkout@v4.1.1
    - uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: temurin
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: pip install "pyspark==${{ matrix.pyspark }}" findspark pytest
    - name: Run tests
      working-directory: python
      run: |
        export SPARK_HOME=$(python -c "import pyspark, os; print(os.path.dirname(pyspark.__file__))")
        python -m pytest sparktestingbase/test/comparison_test.py sparktestingbase/test/simple_sql_test.py -v
