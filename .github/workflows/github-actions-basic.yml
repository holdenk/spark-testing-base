name: Build and test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**'
  push:
    branches:
    - '**'
    - '!branch-*.*'

jobs:
  # Build: build spark-testing-base and run the tests for specified modules.
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - spark: "3.5.0"
            java-version: "11"
            distribution: "temurin"
          - spark: "3.5.0"
            java-version: "17"
            distribution: "temurin"
          - spark: "4.0.0"
            java-version: "17"
            distribution: "temurin"
          - spark: "4.1.0"
            java-version: "17"
            distribution: "temurin"
          - spark: "4.2.0"
            java-version: "17"
            distribution: "temurin"
    env:
      SPARK_VERSION: ${{ matrix.spark }}
    steps:
    - name: Checkout spark-testing-base
      uses: actions/checkout@v4.1.1
      # In order to fetch changed files
      with:
        fetch-depth: 0
        repository: holdenk/spark-testing-base
    - uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: ${{ matrix.distribution }}
        # Deliberately NOT using `cache: sbt` here. Our dependency set is a
        # function of -DsparkVersion, which lives in the matrix rather than in
        # any file on disk, so setup-java's file-hash-only key collapses all
        # matrix entries onto one cache. The explicit cache step below keys on
        # matrix.spark and covers the same directories.
    - name: Add sbt
      uses: sbt/setup-sbt@v1
    - name: Cache maven modules
      id: cache-maven
      uses: actions/cache@v4
      env:
        cache-name: cache-maven
      with:
        # maven cache files are stored in `~/.m2` & `~/.ivy2` on Linux/macOS.
        # The lock / ivydata exclusions match what setup-java's sbt cache did.
        path: |
          ~/.m2
          ~/.ivy2/cache
          ~/.sbt
          ~/.cache/coursier
          !~/.sbt/*.lock
          !~/**/ivydata-*.properties
        key: ${{ runner.os }}-${{ matrix.java-version }}-${{ matrix.spark }}-build-${{ env.cache-name }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt') }}
    - name: Run tests
      run: SPARK_TESTING=yes ./build/sbt clean +compile +test -DsparkVersion=$SPARK_VERSION
